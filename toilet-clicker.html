<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Toilet Clicker™</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#171717;color:#fff;font:16px Arial;text-align:center;overflow:hidden}
h1{margin:12px 0 4px;color:#8cff66}
#stats{font-size:17px;margin-bottom:8px}
#game{display:flex;gap:12px;height:calc(100vh - 75px);padding:8px;max-width:1000px;margin:auto}
#left{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
#right{width:330px;background:#222;border:2px solid #444;border-radius:14px;padding:8px;display:flex;flex-direction:column;min-height:0}
#upgrades{overflow-y:auto;flex:1;padding-right:4px}
#toilet{font-size:145px;background:#292929;border:4px solid #666;border-radius:25px;width:260px;height:260px;cursor:pointer;transition:.06s;user-select:none;display:flex;align-items:center;justify-content:center}
#toilet:active{transform:scale(.94)}
button{border:0;border-radius:10px;padding:10px;margin:4px;font-weight:bold;cursor:pointer}
.ctrl{width:260px;background:#333;color:white;border:2px solid #666}
.rebirth{background:#8b55d9;color:white}
.reset{background:#d33;color:white}
.up{width:100%;margin:4px 0;background:#333;color:white;text-align:left;border:1px solid #555}
.up:hover:not(:disabled){background:#444}
.up:disabled{opacity:.4;cursor:not-allowed}
.name{font-weight:bold;color:#8cff66}
.lvl{float:right;color:#aaa}
.cost{color:#ffd85c}
.pop{position:fixed;pointer-events:none;font-weight:bold;color:#8cff66;animation:f 1s forwards}
@keyframes f{to{transform:translateY(-80px);opacity:0}}
@media(max-width:700px){
#game{flex-direction:column;height:calc(100vh - 70px)}
#left{min-height:390px;flex:none}
#right{width:100%;height:40vh}
#toilet{width:220px;height:220px;font-size:120px}
}
</style>
</head>

<body>

<h1>🚽 TOILET CLICKER™</h1>

<div id="stats">
💩 <b id="p">0</b>
| +<b id="pc">1</b>/click
| ⚡ <b id="ps">0</b>/sec
| 🪙 <b id="coins">0</b>
| 🔄 Rebirths: <b id="rb">0</b>
</div>

<div id="game">

<div id="left">

<div id="goal">🎯 Goal: 1 Billion Poop</div>

<div id="toilet">🚽</div>

<button class="ctrl rebirth" id="rebirthBtn">🔄 REBIRTH</button>
<button class="ctrl reset" id="resetBtn">🗑️ RESET</button>

</div>

<div id="right">

<h2 style="margin:4px">🛒 UPGRADES</h2>

<div id="upgrades"></div>

</div>

</div>

<script>

let p=0;
let rb=0;
let coins=0;
let click=1;
let sec=0;
let mult=1;

const pEl=document.getElementById("p");
const pcEl=document.getElementById("pc");
const psEl=document.getElementById("ps");
const coinsEl=document.getElementById("coins");
const rbEl=document.getElementById("rb");
const goalEl=document.getElementById("goal");
const toiletEl=document.getElementById("toilet");
const upgradesEl=document.getElementById("upgrades");
const rebirthBtn=document.getElementById("rebirthBtn");
const resetBtn=document.getElementById("resetBtn");

const U=[
["🧻 Toilet Paper",10,1,0],
["💦 Better Flush",50,0,1],
["🪠 Plunger",150,3,0],
["🚿 Bidet",500,0,5],
["⚙️ Turbo Toilet",2000,10,10],
["🏭 Poop Factory",10000,25,40],
["🤖 Poop Robot",50000,75,150],
["⚡ Mega Flush",200000,200,500],
["🧪 Poop Lab",1000000,600,2000],
["🌎 Global Toilet",5000000,2000,8000],
["🛰️ Poop Satellite",20000000,8000,30000],
["☢️ Nuclear Toilet",100000000,30000,100000],
["🌀 Quantum Toilet",500000000,100000,400000],
["👽 Alien Toilet",2000000000,400000,2000000],
["🌌 Galaxy Toilet",10000000000,2000000,10000000],
["🕳️ Black Hole Toilet",50000000000,10000000,50000000],
["♾️ Infinite Flush",200000000000,50000000,200000000],
["🧠 Sentient Toilet",1000000000000,200000000,1000000000],
["👑 Royal Toilet",10000000000000,1000000000,5000000000],
["💎 Diamond Toilet",100000000000000,5000000000,20000000000],
["🌋 Volcano Toilet",1000000000000000,20000000000,100000000000],
["☀️ Solar Toilet",10000000000000000,100000000000,500000000000],
["🌠 Cosmic Toilet",100000000000000000,500000000000,2000000000000],
["🪐 Planet Toilet",1000000000000000000,2000000000000,10000000000000],
["🌌 Universe Toilet",1e20,1e13,5e13],
["🛸 Multiverse Toilet",1e22,5e13,2e14],
["⏳ Time Toilet",1e25,2e14,1e15],
["🧬 Reality Toilet",1e28,1e15,5e15],
["💀 Forbidden Toilet",1e32,5e15,2e16],
["🚽 THE FINAL TOILET",1e36,2e16,1e17]
];

let lv=Array(U.length).fill(0);

function fmt(n){

if(!isFinite(n))return"∞";

if(n<1000)return Math.floor(n).toLocaleString();

const units=["K","M","B","T","Qa","Qi","Sx","Sp","Oc","No"];

let i=-1;

while(n>=1000&&i<units.length-1){
n/=1000;
i++;
}

return n.toFixed(n<10?2:1)+units[i];

}

function cost(i){

return U[i][1]*Math.pow(1.17,lv[i]);

}

function draw(){

pEl.textContent=fmt(p);
pcEl.textContent=fmt(click*mult);
psEl.textContent=fmt(sec*mult);
coinsEl.textContent=fmt(coins);
rbEl.textContent=rb;

if(p>=1000000000){
goalEl.textContent="🏆 1 BILLION POOP REACHED!";
}else{
goalEl.textContent="🎯 Goal: 1 Billion Poop";
}

upgradesEl.innerHTML="";

U.forEach(function(u,i){

let c=cost(i);

let b=document.createElement("button");

b.className="up";
b.disabled=p<c;

b.innerHTML=
'<span class="name">'+u[0]+'</span>'+
'<span class="lvl">Lv.'+lv[i]+'</span>'+
'<br>💩 +'+fmt(u[2])+' click | ⚡ +'+fmt(u[3])+'/sec'+
'<br><span class="cost">Cost: '+fmt(c)+' 💩</span>';

b.onclick=function(){
buy(i);
};

upgradesEl.appendChild(b);

});

}

function buy(i){

let c=cost(i);

if(p<c)return;

p-=c;

lv[i]++;

click+=U[i][2];
sec+=U[i][3];

save();
draw();

}

function poop(e){

let gain=click*mult;

p+=gain;

let q=document.createElement("div");

q.className="pop";
q.textContent="+"+fmt(gain)+" 💩";

q.style.left=(e.clientX||innerWidth/2)+"px";
q.style.top=(e.clientY||innerHeight/2)+"px";

document.body.appendChild(q);

setTimeout(function(){
q.remove();
},1000);

draw();
save();

}

function rebirth(){

if(p<1000000000){

alert("You need 1 BILLION 💩 to rebirth!");

return;

}

let gain=Math.floor(Math.sqrt(p/1000000000)*10)+1;

coins+=gain;
rb+=gain;

mult=1+rb*.25;

p=0;
click=1;
sec=0;

lv=Array(U.length).fill(0);

save();
draw();

alert("🔄 REBIRTH!\n\nYou gained "+gain+" 🪙 Poop Coins!\n\nPermanent multiplier: x"+mult.toFixed(2));

}

function resetGame(){

if(!confirm("Delete ALL progress?"))return;

localStorage.removeItem("toiletClicker");

p=0;
rb=0;
coins=0;
click=1;
sec=0;
mult=1;
lv=Array(U.length).fill(0);

save();
draw();

}

function save(){

localStorage.setItem(
"toiletClicker",
JSON.stringify({
p:p,
rb:rb,
coins:coins,
click:click,
sec:sec,
lv:lv
})
);

}

function load(){

try{

let x=JSON.parse(localStorage.getItem("toiletClicker"));

if(!x)return;

p=x.p||0;
rb=x.rb||0;
coins=x.coins||0;
click=x.click||1;
sec=x.sec||0;
lv=Array.isArray(x.lv)?x.lv:Array(U.length).fill(0);

mult=1+rb*.25;

}catch(e){

console.log("Save could not be loaded.");

}

}

toiletEl.addEventListener("click",poop);

rebirthBtn.addEventListener("click",rebirth);

resetBtn.addEventListener("click",resetGame);

setInterval(function(){

if(sec>0){

p+=sec*mult;

draw();
save();

}

},1000);

load();
draw();

</script>

</body>
</html>
